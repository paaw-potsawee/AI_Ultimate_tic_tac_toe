services:
    uttt:
        image: uttt:latest
        container_name: uttt
        restart: always
        build:
            context: .
            dockerfile: Dockerfile
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost/"]
            interval: 30s
            timeout: 10s
            retries: 5
        ports:
            - "3000:80"
